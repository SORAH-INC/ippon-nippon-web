<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PARIS FIELD LOG — IPPON NIPPON | Reading Wood</title>
<style>
:root{
  --gray:#C6C6C6;
  --panel:#FCD383;
  --yellow:#FFFF00;
  --ink:#111;
}
*{margin:0;padding:0;box-sizing:border-box}
html{
  overflow-x:clip;
}
body{
  background:#fff;
  color:var(--ink);
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  overflow-x:clip;
  overscroll-behavior-x:none;
  touch-action:pan-y pinch-zoom;
}
img{display:block;user-select:none;-webkit-user-drag:none}

.wrap{
  width:min(94vw,880px);
  margin:0 auto;
  padding:6vh 0 0;
  text-align:center;
}

/* logo */
.word-row{
  display:flex;justify-content:center;align-items:flex-end;
  gap:14%;padding:1.5% 0 0;
}
.word-row img{height:auto;opacity:0;transform:translateY(.9em);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.word-row img.w-ippon{width:15%}
.word-row img.w-nippon{width:18%}
.word-row img:nth-child(2){animation-delay:.15s}
@keyframes rise{to{opacity:1;transform:none}}
.word-row a.logo-link{display:contents}

.page-head{margin:3.4rem 0 0}
.page-head .eyebrow{
  display:inline-block;
  font-size:.68rem;font-weight:500;letter-spacing:.24em;
  background:var(--panel);
  padding:.55em 1em;
  margin-bottom:1.6rem;
}
.page-head h1{
  font-size:clamp(1.05rem,3vw,1.5rem);
  font-weight:500;letter-spacing:.06em;line-height:2;
}
.page-head .note{
  margin:1.2rem auto 0;
  font-size:.7rem;line-height:1.9;color:#777;
  max-width:36em;
}
.legend{
  margin-top:1.6rem;
  font-size:.66rem;letter-spacing:.14em;color:#555;
  display:flex;gap:2.2em;flex-wrap:wrap;justify-content:center;
}
.legend .k{display:inline-flex;align-items:center;gap:.6em}
.legend .dot{width:.7em;height:.7em;background:var(--yellow);border:1.5px solid var(--ink);border-radius:50%}
.legend .sq{width:.7em;height:.7em;background:var(--yellow);border:1.5px solid var(--ink)}
.legend .or{width:1.4em;height:.7em;background:var(--panel)}

/* ===== centered timeline ===== */
.timeline{
  position:relative;
  margin-top:3.2rem;
  padding-bottom:1rem;
}
/* central ruler: main line + parallax tick layers */
.timeline::before{
  content:"";
  position:absolute;
  left:50%;top:0;bottom:0;
  width:2px;
  margin-left:-1px;
  background:var(--ink);
}
.ticks{
  position:absolute;
  left:50%;top:0;bottom:0;
  pointer-events:none;
}
.ticks-fast{
  width:9px;margin-left:1px;
  background:repeating-linear-gradient(
    to bottom,
    var(--ink) 0, var(--ink) 1px,
    transparent 1px, transparent 14px
  );
  opacity:.3;
}
.ticks-slow{
  width:16px;margin-left:1px;
  background:repeating-linear-gradient(
    to bottom,
    var(--ink) 0, var(--ink) 2px,
    transparent 2px, transparent 70px
  );
  opacity:.14;
}
.timeline > *{position:relative;z-index:1}
.timeline > .ticks{position:absolute;z-index:0}

/* day block: children shrink to content, white bg masks the axis */
.day{padding:3.5rem 0}
.day > *{
  width:fit-content;
  max-width:min(88vw,46em);
  margin:.4rem auto;
  background:#fff;
}

/* date chip on the axis */
.d-chip{
  font-size:.7rem;letter-spacing:.12em;
  border:1.5px solid var(--ink);
  padding:.45em 1em;
  display:flex;align-items:baseline;gap:.8em;
}
.d-chip .dow{color:#999;font-size:.82em;letter-spacing:.18em}
.day.closed .d-chip{border-color:#ccc;color:#bbb}
.day.closed .d-chip .dow{color:#ccc}
.closed-note{font-size:.6rem;color:#ccc;letter-spacing:.22em;padding:0 1em}

/* visitor counter (scroll count-up, size scales with n) */
.vis{
  padding:.15rem 1em 0;
  display:flex;align-items:baseline;gap:.55em;justify-content:center;
}
.vis .num{
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.vis .unit{
  font-size:.6rem;color:#999;letter-spacing:.2em;
}
.vis.peak .num{
  background:linear-gradient(transparent 62%, var(--yellow) 62%);
}

/* daily note */
.d-note{
  font-size:.74rem;line-height:1.9;color:#444;
  padding:.1rem 1.2em;
}

/* day photos (Instagram) */
.d-photos{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  padding:.5rem 0 .2rem;
}
.d-photos{will-change:transform}
.echo-photos{will-change:transform}
.d-photos a{display:inline-block;color:var(--ink);text-decoration:none;background:#fff}
.d-photos img{
  height:170px;width:auto;max-width:250px;object-fit:cover;
  border:1.5px solid var(--ink);
  filter:grayscale(1);
  transition:filter .3s ease;
}
.d-photos a:hover img{filter:none}
.d-photos .cap{
  display:block;margin-top:.45rem;
  font-size:.56rem;letter-spacing:.16em;color:#999;
  text-align:center;
}
.d-photos a:hover .cap{color:var(--ink)}

/* ===== question ===== */
.q{
  padding:1.2rem 0 .2rem;
  position:relative;
}
.q::before{
  content:"";
  position:absolute;
  left:50%;top:-2px;
  width:12px;height:12px;
  transform:translateX(-50%);
  background:var(--yellow);
  border:2px solid var(--ink);
  border-radius:50%;
  transition:background .25s ease;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(252,211,131,.9)}
  50%{box-shadow:0 0 0 7px rgba(252,211,131,0)}
}
.q.open::before{background:var(--ink);animation:none}
.q-head{
  display:block;
  background:#fff;border:none;cursor:pointer;
  font-family:inherit;color:var(--ink);
  text-align:center;
  margin:0 auto;
  padding:0 1.4em;
}
.q-head .q-mark{
  display:inline-block;
  font-size:.6rem;font-weight:600;letter-spacing:.22em;
  background:var(--yellow);
  border:1.5px solid var(--ink);
  padding:.4em .8em;
  margin-bottom:.7rem;
}
.q-head .q-text{
  display:block;
  font-size:clamp(.94rem,2.4vw,1.14rem);
  font-weight:500;line-height:2;
  max-width:30em;
  border-bottom:3px solid var(--yellow);
  transition:background .25s ease;
  padding-bottom:.15em;
}
.q-head:hover .q-text{background:var(--yellow)}
.q-head .q-toggle{
  display:inline-flex;align-items:center;gap:.5em;
  margin-top:.7rem;
  font-size:.6rem;font-weight:600;letter-spacing:.22em;
  border:1.5px solid var(--ink);
  padding:.45em .9em;
  transition:background .25s ease,color .25s ease;
}
.q-head:hover .q-toggle{background:var(--ink);color:#fff}
.q-head .q-toggle .pm{font-size:1.2em;line-height:1}

/* ===== echo (orange, full-bleed) ===== */
.echo{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1);
  width:auto !important;
  max-width:none !important;
  position:relative;
  margin-inline:calc(50% - 50vw) !important;
  background:transparent !important;
}
.q.open .echo{grid-template-rows:1fr}
.echo > .echo-inner{overflow:hidden}
.echo-body{
  margin:1.1rem 0 .6rem;
  background:var(--panel);
  padding:2rem 1rem 2.2rem;
}
.echo-body > *{max-width:40em;margin-left:auto;margin-right:auto}
.echo-label{
  font-size:.6rem;font-weight:600;letter-spacing:.3em;
  color:rgba(17,17,17,.55);margin-bottom:1.3rem;
}
.dlg{margin:0 auto 1.15rem;max-width:32em}
.dlg .spk{
  font-size:.62rem;font-weight:600;letter-spacing:.18em;
  margin-bottom:.35rem;color:rgba(17,17,17,.6);
}
.dlg .txt{font-size:.8rem;line-height:2}
.dlg.quote .txt{
  display:inline-block;
  font-weight:600;
  font-size:.88rem;
  text-align:center;
  border-bottom:2px solid var(--ink);
  padding-bottom:.35em;
}
.echo-photos{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  margin-top:1.5rem;
}
.echo-photos a{display:inline-block}
.echo-photos img{
  height:160px;width:auto;max-width:240px;object-fit:cover;
  border:1.5px solid var(--ink);
  filter:grayscale(1);
  transition:filter .3s ease;
}
.echo-photos a:hover img{filter:none}

/* phase markers */
.phase{padding:4.5rem 0 1.6rem}
.phase > *{width:fit-content;margin:.5rem auto;background:#fff}
.phase .ph-label{
  font-size:.66rem;font-weight:500;letter-spacing:.26em;
  border:1.5px solid var(--ink);
  padding:.55em 1.1em;
}

/* view switch */
.view-switch{
  margin-top:2.4rem;
  display:flex;justify-content:center;gap:2.4em;
}
.view-switch button{
  font-family:inherit;
  font-size:.72rem;font-weight:600;letter-spacing:.22em;
  background:none;border:none;cursor:pointer;color:#999;
  padding:.2em 0 .45em;
  border-bottom:2px solid transparent;
}
.view-switch button.on{color:var(--ink);border-color:var(--yellow)}
.view-switch button:hover{color:var(--ink)}

/* question index view — card grid with in-place echo */
.q-index{
  margin-top:3rem;
  padding-bottom:1rem;
}
.q-index .ix-head{
  font-size:.6rem;font-weight:500;letter-spacing:.3em;color:#999;
  margin-bottom:2rem;
}
.ix-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  text-align:left;
}
.ix-item{
  display:flex;flex-direction:column;align-items:flex-start;gap:.9rem;
  background:#fff;
  border:1.5px solid var(--ink);
  padding:1.4rem 1.3rem 1.2rem;
  cursor:pointer;
  font-family:inherit;color:var(--ink);
  text-align:left;
  transition:background .25s ease;
  min-height:180px;
}
.ix-item:hover{background:var(--panel)}
.ix-item.on{background:var(--panel);box-shadow:inset 0 -4px 0 var(--yellow)}
.ix-item .ix-date{
  font-size:.6rem;letter-spacing:.18em;color:#999;
}
.ix-item:hover .ix-date,.ix-item.on .ix-date{color:var(--ink)}
.ix-item .ix-q{
  font-size:.88rem;font-weight:500;line-height:1.95;
}
.ix-item .ix-n{
  margin-top:auto;
  font-size:.58rem;letter-spacing:.2em;color:#bbb;
  border-top:1.5px solid rgba(17,17,17,.15);
  padding-top:.8rem;
  width:100%;
}
.ix-item:hover .ix-n,.ix-item.on .ix-n{color:var(--ink);border-color:rgba(17,17,17,.4)}
.ix-echo{
  grid-column:1 / -1;
  background:var(--panel);
  padding:2rem 1.3rem 2.2rem;
  text-align:center;
}
.ix-echo[hidden]{display:none}
.ix-echo > *{max-width:40em;margin-left:auto;margin-right:auto}
@media (max-width:820px){.ix-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.ix-grid{grid-template-columns:1fr}}

/* fixed date gauge */
.gauge{
  position:fixed;
  left:0;top:50%;
  transform:translateY(-50%);
  z-index:5;
  background:var(--yellow);
  border:2px solid var(--ink);
  border-left:none;
  padding:.45em .8em .45em .7em;
  font-size:.7rem;font-weight:500;letter-spacing:.12em;
  pointer-events:none;
  opacity:0;
  transition:opacity .4s ease;
}
.gauge.show{opacity:1}

/* end */
.the-end{
  padding:3.5rem 0 0;
  font-size:.74rem;color:#999;line-height:2;
}

/* footer */
.site-foot{
  margin-top:5.5rem;
  padding:3.5rem 0 3rem;
  text-align:center;
}
.foot-links{
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:clamp(1.6rem,6vw,4rem);
  margin-bottom:3rem;
}
.foot-links a{
  color:var(--ink);text-decoration:none;
  font-size:.78rem;font-weight:600;letter-spacing:.22em;
  padding-bottom:.35em;border-bottom:2px solid var(--ink);
  transition:border-color .25s ease;
}
.foot-links a:hover{border-color:var(--yellow)}
.copyright{font-size:.64rem;letter-spacing:.18em;line-height:2.2;color:#555}

@media (max-width:640px){
  .d-photos img{height:120px;max-width:180px}
  .echo-photos img{height:118px;max-width:176px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .word-row img{opacity:1;transform:none}
}
</style>
</head>

// ===== render =====
const tl = document.getElementById('timeline');
const dayEls = [];
const QLIST = [];

function photoRow(keys, cls){
  if(!keys || !keys.length) return '';
  const items = keys.map(k => `
    <a href="${igLink(k)}" target="_blank" rel="noopener">
      <img src="${PIC[k].src}" alt="${PIC[k].cap}" loading="lazy">
      <span class="cap">IG — ${PIC[k].cap}</span>
    </a>`).join('');
  return `<div class="${cls}">${items}</div>`;
}

function echoInnerHtml(q, dateLabel){
  const dlgs = q.echo.dlgs.map(d =>
    `<div class="dlg${d.type === 'quote' ? ' quote' : ''}">
       ${d.spk ? `<div class="spk">${d.spk}</div>` : ''}
       <div class="txt">${d.txt}</div>
     </div>`).join('');
  const photos = (q.echo.photos && q.echo.photos.length)
    ? `<div class="echo-photos">${q.echo.photos.map(k => `
        <a href="${igLink(k)}" target="_blank" rel="noopener"><img src="${PIC[k].src}" alt="${PIC[k].cap}" loading="lazy"></a>`).join('')}</div>`
    : '';
  return `<div class="echo-label">ECHO — ${dateLabel}</div>${dlgs}${photos}`;
}

function renderDay(day){
  const el = document.createElement('section');
  el.className = 'day' + (day.closed ? ' closed' : '');
  let html = `<div class="d-chip">${day.d}<span class="dow">${day.dow}</span></div>`;
  if (day.closed) {
    html += `<div class="closed-note">CLOSED</div>`;
  } else {
    if (day.n !== null && day.n !== undefined) {
      const fs = (0.85 + Math.min(day.n,50)/50*2.1).toFixed(2);
      html += `<div class="vis${day.peak ? ' peak' : ''}"><span class="num" data-count="${day.n}" style="font-size:${fs}rem">0</span><span class="unit">VISITORS</span></div>`;
    }
    if (day.note) html += `<p class="d-note">${day.note}</p>`;
    html += photoRow(day.photos, 'd-photos');
    (day.qs || []).forEach(q => {
      q._id = 'q-' + (QLIST.length);
      const inner = echoInnerHtml(q, day.d);
      QLIST.push({id: q._id, d: day.d, q: q.q, n: q.echo.dlgs.length, echo: inner});
      html += `
      <div class="q" data-q id="${q._id}">
        <button class="q-head" aria-expanded="false">
          <span class="q-mark">QUESTION</span>
          <span class="q-text">${q.q}</span>
          <span class="q-toggle"><span class="pm">＋</span>ECHOを開く</span>
        </button>
        <div class="echo"><div class="echo-inner"><div class="echo-body">${inner}</div></div></div>
      </div>`;
    });
  }
  el.innerHTML = html;
  el.dataset.date = day.d;
  tl.appendChild(el);
  dayEls.push(el);
}

const openPhase = document.createElement('div');
openPhase.className = 'phase';
openPhase.innerHTML = `<span class="ph-label">OPEN — 26 JULY 2026</span>`;
tl.appendChild(openPhase);

DAYS.forEach(d => renderDay(d));

const closePhase = document.createElement('div');
closePhase.className = 'phase';
closePhase.innerHTML = `<span class="ph-label">CLOSE — 23 AUGUST 2026</span>`;
tl.appendChild(closePhase);

// question toggle
tl.addEventListener('click', e => {
  const head = e.target.closest('.q-head');
  if (!head) return;
  const q = head.closest('.q');
  const open = q.classList.toggle('open');
  head.setAttribute('aria-expanded', open);
  const t = head.querySelector('.q-toggle');
  t.innerHTML = open ? '<span class="pm">－</span>ECHOを閉じる' : '<span class="pm">＋</span>ECHOを開く';
});

// ===== visitor counters: count up on scroll into view =====
function animateCount(el){
  const target = +el.dataset.count;
  const dur = 900;
  const t0 = performance.now();
  function step(t){
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const cio = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) { animateCount(en.target); cio.unobserve(en.target); }
  });
}, {threshold: 0.6});
document.querySelectorAll('.vis .num').forEach(el => cio.observe(el));

// ===== question index view: panel opens ECHO in place =====
const ix = document.getElementById('qIndex');
ix.innerHTML = `<div class="ix-head">QUESTIONS — ${QLIST.length}</div>
  <div class="ix-grid">` +
  QLIST.map(item => `
    <button class="ix-item" data-echo="${item.id}">
      <span class="ix-date">${item.d} — PARIS</span>
      <span class="ix-q">${item.q}</span>
      <span class="ix-n">${item.n} ECHOES</span>
    </button>
    <div class="ix-echo" id="ix-${item.id}" hidden>${item.echo}</div>`).join('') + `</div>`;

const vwTl = document.getElementById('vwTl');
const vwIx = document.getElementById('vwIx');
const endLine = document.querySelector('.the-end');
function setView(v){
  const isTl = v === 'tl';
  tl.hidden = !isTl;
  endLine.hidden = !isTl;
  ix.hidden = isTl;
  vwTl.classList.toggle('on', isTl);
  vwIx.classList.toggle('on', !isTl);
  if(!isTl) gauge.classList.remove('show');
}
vwTl.addEventListener('click', () => setView('tl'));
vwIx.addEventListener('click', () => setView('ix'));

ix.addEventListener('click', e => {
  const item = e.target.closest('.ix-item');
  if(!item) return;
  const panel = document.getElementById('ix-' + item.dataset.echo);
  const willOpen = panel.hidden;
  // close all
  ix.querySelectorAll('.ix-echo').forEach(p => p.hidden = true);
  ix.querySelectorAll('.ix-item').forEach(b => b.classList.remove('on'));
  if(willOpen){
    panel.hidden = false;
    item.classList.add('on');
    setTimeout(() => panel.scrollIntoView({behavior:'smooth', block:'nearest'}), 40);
  }
});

// ===== scroll: parallax tick layers + fixed date gauge =====
const gauge = document.getElementById('gauge');
const ticksFast = document.getElementById('ticksFast');
const ticksSlow = document.getElementById('ticksSlow');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const plxEls = [...document.querySelectorAll('.d-photos, .echo-photos, .phase .ph-label')];
let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY;
    if (!reduceMotion) {
      ticksFast.style.backgroundPosition = `0 ${-(y * 0.5)}px`;
      ticksSlow.style.backgroundPosition = `0 ${(y * 0.16)}px`;
    }
    // gentle photo-layer parallax
    if (!reduceMotion) {
      const vhm = window.innerHeight / 2;
      for (const el of plxEls) {
        const r = el.getBoundingClientRect();
        if (r.bottom < -200 || r.top > window.innerHeight + 200) continue;
        const off = (r.top + r.height / 2 - vhm) * -0.07;
        el.style.transform = `translateY(${off.toFixed(1)}px)`;
      }
    }
    const mid = window.innerHeight * 0.5;
    let current = null;
    for (const el of dayEls) {
      const r = el.getBoundingClientRect();
      if (r.top <= mid) current = el.dataset.date;
    }
    if (current && !tl.hidden) { gauge.textContent = current; gauge.classList.add('show'); }
    else gauge.classList.remove('show');
    ticking = false;
  });
}, {passive:true});
</script>
