<title>IPPON NIPPON — Reading Wood | the world's echo</title>
<style>
:root{
  --gray:#C6C6C6;
  --panel:#FCD383;
  --yellow:#FFFF00;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;overflow-x:hidden}
img{display:block;user-select:none;-webkit-user-drag:none}

/* ---------- composition ---------- */
.poster{
  width:min(92vw,880px);
  margin:0 auto;
  padding:5vh 0 4vh;
}

/* big words (original type as images) */
.word-row{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:14%;
  padding:3.2% 0;
}
.word-row img{
  height:auto;
  opacity:0;
  transform:translateY(.9em);
  animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;
}
.word-row img.w-ippon{width:13.9%}
.word-row img.w-nippon{width:16.8%}
.word-row img:nth-child(2){animation-delay:.15s}
.word-row.bottom img{animation-delay:.25s}
.word-row.bottom img:nth-child(2){animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}
.word-row a.logo-link{display:contents}


/* stage */
.stage{position:relative}
.gray-col{
  position:absolute;
  left:50%;transform:translateX(-50%);
  width:53%;
  top:0;bottom:0;
  background:var(--gray);
}
.spacer{position:relative;height:clamp(260px,52vh,460px)}
.spacer.lower{height:clamp(320px,62vh,540px)}

/* wood strips */
.strip{
  position:absolute;
  left:50%;
  width:14%;
  top:0;bottom:0;
  transform:translateX(-50%);
  overflow:hidden;
  border-left:2px solid var(--yellow);
  border-right:2px solid var(--yellow);
}
.strip .tex{
  position:absolute;
  left:0;top:-12%;
  width:100%;height:124%;
  background-size:100% auto;
  background-repeat:repeat-y;
  will-change:background-position,transform;
}

@keyframes pan{from{background-position:0 0}to{background-position:0 -420px}}

/* panel — proportions from the original poster */
.panel{
  position:relative;
  z-index:2;
  background:var(--panel);
  padding:7% 7.3% 6% 2.9%;
  display:grid;
  grid-template-columns:42.2% 49.7%;
  justify-content:space-between;
  align-items:start;
}
.rings{
  overflow:hidden;
  margin-top:12.7%;
}
.rings img{
  width:100%;height:auto;
  filter:grayscale(1);
  animation:kenburns 26s ease-in-out infinite alternate;
  transform-origin:55% 60%;
}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}

.info img{height:auto}
.i-eyebrow{width:37.2%}
.i-title{width:49.3%;margin-top:2.8%}
.i-dates{width:100%;margin-top:27.5%}
.i-hours{width:87.9%;margin-top:1.6%}
.i-credits{width:100%}
.i-credits-wrap{position:relative;width:100%;margin-top:10.9%}
.venue-link{
  position:absolute;
  left:0;top:0;
  width:100%;height:26%;
  border-bottom:2px solid transparent;
  transition:border-color .25s ease;
}
.venue-link:hover{border-color:var(--yellow)}

/* staggered reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* echo arcs (original artwork) */
.arcs{
  position:absolute;
  right:6.5%;
  top:16%;
  width:14.9%;
  z-index:3;
  transform-origin:50% 100%;
  animation:echo 4.6s ease-in-out infinite;
}
@keyframes echo{
  0%{opacity:.25;transform:scale(.96)}
  45%{opacity:1;transform:scale(1.03)}
  100%{opacity:.25;transform:scale(.96)}
}

/* side vertical text (original type as images) */
.side{
  position:fixed;
  top:0;bottom:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.side.left{left:clamp(.4rem,1.5vw,1.4rem)}
.side.right{right:clamp(.4rem,1.5vw,1.4rem)}
.side .rail{animation:crawl 55s linear infinite}
.side.right .rail{animation-duration:70s}
.side .rail img{
  height:clamp(130px,17vh,200px);
  width:auto;
  margin-bottom:55vh;
}
@keyframes crawl{from{transform:translateY(0)}to{transform:translateY(-50%)}}

/* footer */
.site-foot{
  padding:clamp(3rem,9vh,5.5rem) 0 clamp(2.5rem,7vh,4rem);
  text-align:center;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
.foot-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:clamp(1.8rem,7vw,4.5rem);
  margin-bottom:clamp(2.4rem,6vh,3.6rem);
}
.foot-links a{
  color:#111;
  text-decoration:none;
  font-size:clamp(.72rem,1.6vw,.85rem);
  font-weight:600;
  letter-spacing:.22em;
  padding-bottom:.35em;
  border-bottom:2px solid #111;
  transition:border-color .25s ease,color .25s ease;
}
.foot-links a:hover{border-color:var(--yellow)}
.copyright{
  font-size:clamp(.58rem,1.3vw,.66rem);
  letter-spacing:.18em;
  line-height:2.2;
  color:#555;
}
.copyright a{color:#555;text-decoration:underline;text-underline-offset:.25em}
.copyright a:hover{color:#111}

@media (max-width:640px){
  .panel{grid-template-columns:1fr;padding:8% 6%}
  .rings{margin-top:0;margin-bottom:8%}
  .i-dates{margin-top:12%}
  .side .rail img{height:clamp(100px,14vh,150px)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .word-row img,.reveal{opacity:1;transform:none}
  .arcs{opacity:1}
}
</style>
</head>

<aside class="side right" aria-hidden="true"><div class="rail" id="railR"></div></aside>

// reveal on scroll
var revealEls = document.querySelectorAll('.reveal');
var io = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){
      e.target.style.transitionDelay = (Array.prototype.indexOf.call(revealEls, e.target) % 6) * 0.12 + 's';
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  });
},{threshold:0.25});
revealEls.forEach(function(el){io.observe(el)});

// gentle parallax on wood strips
var pxEls = document.querySelectorAll('[data-parallax]');
var ticking = false;
window.addEventListener('scroll', function(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    var y = window.scrollY;
    pxEls.forEach(function(el){
      el.style.transform = 'translateY(' + (y * parseFloat(el.dataset.parallax)) + 'px)';
    });
    ticking = false;
  });
},{passive:true});
</script>
